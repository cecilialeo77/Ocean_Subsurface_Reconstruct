[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "glorys-swin-two-stage"
version = "0.1.0"
description = "IPRC-Argo pretraining and GLORYS fine-tuning with Geo-Swin and MoE"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "xarray", "netCDF4", "pyyaml", "torch>=2.5"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
